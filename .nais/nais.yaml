apiVersion: nais.io/v1alpha1
kind: Application
metadata:
    name: tsm-skjermd-frontend
    namespace: team-service-management
    labels:
        team: team-service-management
spec:
  envFrom:
    - secret: serviceaccounts-jira
    - secret: tsm-skjermd-frontend
  ingresses:
    - https://tsm-skjermd-frontend.intern.nav.no
  image: {{image}}
  replicas:
    min: 1
    max: 1
  port: 8080
  azure:
    application:
      enabled: true
      tenant: nav.no
      allowAllUsers: true
      claims:
        extra:
          - "NAVident"
          - "azp_name"
      replyURLs:
        - "https://tsm-skjermd-frontend.intern.nav.no/embed/auth/callback"
    sidecar:
        enabled: true
        autoLogin: true
        autoLoginIgnorePaths:
          - /health/*
          - /assets/*
          - /favicon.svg
          - /embed/sensurering/*
          - /embed/sensurering-editor/*
          - /embed/auth/start
          - /embed/auth/callback
          - /embed/api/saker/*
          - /embed/api/saker/*/tilganger
          - /embed/api/saker/*/tilganger/*
          - /embed/api/saker/*/sensurering
          - /embed/api/saker/*/kommentarer
          - /embed/api/saker/*/leselogg
          - /embed/api/saker/*/filer
          - /embed/api/saker/*/filer/*
          - /embed/api/jira/update-description
          - /embed/api/jira/add-comment
          - /embed/api/brukere
          - /embed/api/auth-config
          - /embed/api/auth/poll
  env:
    - name: BACKEND_URL
      value: "http://tsm-skjermd"
    - name: BACKEND_TARGET_AUDIENCE
      value: "api://prod-gcp.team-service-management.tsm-skjermd/.default"
  accessPolicy:
    outbound:
      rules:
        - application: tsm-skjermd
